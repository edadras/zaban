name: zaban
description: Zaban — adaptive AI language learning client for web, Android and iOS.
publish_to: "none"
version: 0.1.0+1

environment:
  # 3.8 is the floor because json_serializable 6.11 emits null-aware elements
  # ("'gateway': ?instance.gateway") into the generated code, and a package
  # whose language version is older than that will not compile them.
  sdk: ">=3.8.0 <4.0.0"
  # 3.32 ships Dart 3.8; the design system also needs Color.withValues(), which
  # arrived in 3.27.
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  # Material's own strings, and the right-to-left machinery Persian needs.
  flutter_localizations:
    sdk: flutter

  # State management. Pinned to the Riverpod 2.x API (Notifier / AsyncNotifier);
  # no riverpod_generator, so providers are plain top-level finals.
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # HTTP
  dio: ^5.7.0

  # Models / serialisation
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # The live classroom. 2.6.4 is the last release that resolves against the
  # Flutter floor above: 2.6.5 wants meta 1.17, which flutter_localizations
  # pins to 1.16 on 3.32, and 2.12 wants Flutter 3.38. Moving the whole app
  # to a new SDK for a newer WebRTC wrapper is not a trade worth making.
  livekit_client: ^2.6.4

  # Media: recording for speech practice, playback for listening blocks, and
  # the coach's uploaded video on the classroom stage. video_player is held at
  # 2.10 for the same Flutter floor as livekit_client above.
  record: ^5.2.0
  video_player: ^2.10.1
  just_audio: ^0.9.42
  permission_handler: ^11.3.1
  path_provider: ^2.1.5

  # Live updates. A plain socket rather than a native Pusher plugin: Reverb
  # speaks the Pusher wire protocol, which is small enough to talk directly,
  # and this keeps web, Android and iOS on one code path with no platform
  # channel to configure.
  web_socket_channel: ^3.0.3

  # Misc
  collection: ^1.19.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  file_picker: ^8.1.7
  pdfrx: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  # Fonts are intentionally not bundled: the theme falls back to the platform UI
  # font unless a family is supplied (see README "Typography").
  assets:
    - assets/
