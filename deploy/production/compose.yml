name: zaban-learn
x-app: &app
  image: zaban/app:learn
  restart: unless-stopped
  env_file: ./app.env
  volumes:
    - ../../backend/storage:/srv/zaban/backend/storage
    - ../../backend/public:/srv/zaban/backend/public:ro
    # Live room UI + classroom hotfixes without rebuilding the app image.
    - ../../backend/resources/views:/srv/zaban/backend/resources/views:ro
    - ../../backend/routes/api/classroom.php:/srv/zaban/backend/routes/api/classroom.php:ro
    - ../../backend/app/Http/Controllers/Api/V1/Classroom:/srv/zaban/backend/app/Http/Controllers/Api/V1/Classroom:ro
    - ../../backend/app/Http/Controllers/Api/V1/MediaController.php:/srv/zaban/backend/app/Http/Controllers/Api/V1/MediaController.php:ro
    - ../../backend/app/Services/Classroom:/srv/zaban/backend/app/Services/Classroom:ro
    - ../../backend/app/Events/Classroom:/srv/zaban/backend/app/Events/Classroom:ro
    - ../../backend/app/Models/ClassSession.php:/srv/zaban/backend/app/Models/ClassSession.php:ro
    - ../../backend/app/Models/ClassChatMessage.php:/srv/zaban/backend/app/Models/ClassChatMessage.php:ro
    - ../../sources:/srv/zaban/sources:ro
    - ../../sources:/srv/zaban/backend/storage/app/private/sources:ro
    - /opt/zaban-whisper:/opt/zaban-whisper:ro
    # Where the egress worker writes a finished class recording. The worker
    # sees it as /recordings; this is the same volume, at the path
    # LIVE_RECORDING_LOCAL_DIR defaults to, so the application can pick the
    # file up and turn it into a media asset.
    - recordings:/srv/zaban/backend/storage/app/recordings
  networks: [private]
  mem_limit: 2g
  cpus: 2
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  app:
    <<: *app
    build:
      context: ../..
      dockerfile: docker/php/Dockerfile
      target: prod
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    <<: *app
    command: [supervisord, -c, /srv/zaban/docker/worker/supervisord.conf]
    stop_grace_period: 1900s
  scheduler:
    <<: *app
    command: [php, artisan, schedule:work]
  reverb:
    <<: *app
    command: [php, artisan, reverb:start, --host=0.0.0.0, --port=8080]
    mem_limit: 512m
    cpus: 1
    depends_on:
      redis: {condition: service_healthy}
      app: {condition: service_started}
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../../backend/public:/srv/zaban/backend/public:ro
      - ../../mobile/build/web:/srv/web:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ['127.0.0.1:8100:80']
    networks:
      private: {}
      edge:
        aliases: [zaban-learn-nginx]
    mem_limit: 256m
    depends_on:
      - app
      - reverb
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://127.0.0.1/up']
      interval: 30s
      timeout: 5s
      retries: 3
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file: ./mysql.env
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci', '--max-allowed-packet=128M', '--innodb-buffer-pool-size=512M', '--max-connections=100']
    volumes: [mysql-data:/var/lib/mysql]
    networks: [private]
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -u root --silent']
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    networks: [private]
    mem_limit: 512m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
  # Faces and voices for the live classroom. Signaling is reached through
  # Caddy at live.zaban.edadras.com; ICE/media uses the published UDP/TCP ports.
  livekit:
    image: livekit/livekit-server:v1.9.2
    restart: unless-stopped
    command: ['--config', '/etc/livekit.yaml']
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - '7881:7881/tcp'
      - '50100-50200:50100-50200/udp'
    networks:
      private: {}
      edge:
        aliases: [zaban-learn-livekit]
    mem_limit: 1g
    cpus: 2
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  # Recording a class. Without this service the SFU accepts the request to
  # record, queues it, and no worker ever takes it: the class sits marked as
  # recording and no file is ever produced.
  #
  # It composites with a headless Chrome, which is why it wants a real core and
  # a larger /dev/shm than Docker's 64MB default - a browser given the default
  # crashes part way through a long class and takes the recording with it.
  livekit-egress:
    image: livekit/egress:v1.9.1
    restart: unless-stopped
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      - recordings:/recordings
    # Chrome's own sandbox needs these; the container runs nothing but the
    # compositor and is not reachable from outside the private network.
    cap_add: [SYS_ADMIN]
    security_opt: [seccomp:unconfined]
    shm_size: 1gb
    networks: [private]
    depends_on:
      redis: {condition: service_healthy}
      livekit: {condition: service_started}
    mem_limit: 2g
    cpus: 2
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  private: {}
  edge:
    external: true
    name: edadras
volumes:
  mysql-data: {}
  redis-data: {}
  # Shared by the egress worker that writes recordings and the app containers
  # that read them. Named rather than a bind mount so it survives a checkout
  # being moved, and so the worker owns the permissions on it.
  recordings: {}
