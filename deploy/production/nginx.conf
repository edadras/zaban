server {
 listen 80 default_server;
 server_name zaban.edadras.com;
 root /srv/web;
 index index.html;
 server_tokens off;
 client_max_body_size 32m;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options SAMEORIGIN always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;

 location ~ /\. { return 404; }
 location ~ ^/(storage|fpm-status|fpm-ping)(/|$) { return 404; }

 location = /up {
  rewrite ^ /index.php last;
 }

 # JSON API
 location ^~ /api/ {
  rewrite ^ /index.php last;
 }

 # School / coach panel (Blade + session auth)
 location ^~ /panel {
  rewrite ^ /index.php last;
 }

 # Panel broadcasting auth (session)
 location ^~ /broadcasting/ {
  rewrite ^ /index.php last;
 }

 # Vite-built panel/room assets (backend/public/build)
 location ^~ /build/ {
  alias /srv/zaban/backend/public/build/;
  add_header Cache-Control "public, max-age=604800, immutable";
  try_files $uri =404;
 }

 # Laravel Reverb websockets
 location ^~ /app {
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "Upgrade";
  proxy_read_timeout 60m;
  proxy_send_timeout 60m;
  proxy_pass http://zaban-learn-reverb-1:8080;
 }

 # LiveKit signaling (WSS). Same long-lived proxy pattern as Reverb —
 # the dedicated live.* Caddy vhost was dropping the socket every ~15s.
 location ^~ /rtc {
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "Upgrade";
  proxy_read_timeout 60m;
  proxy_send_timeout 60m;
  proxy_buffering off;
  proxy_pass http://zaban-learn-livekit-1:7880;
 }

 location ^~ /twirp/ {
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 60s;
  proxy_pass http://zaban-learn-livekit-1:7880;
 }

 location = /index.php {
  include fastcgi_params;
  fastcgi_pass zaban-learn-app-1:9000;
  fastcgi_param SCRIPT_FILENAME /srv/zaban/backend/public/index.php;
  fastcgi_param SCRIPT_NAME /index.php;
  fastcgi_param DOCUMENT_URI /index.php;
  fastcgi_param DOCUMENT_ROOT /srv/zaban/backend/public;
  fastcgi_param HTTPS on;
  fastcgi_param SERVER_PORT 443;
  fastcgi_param HTTP_PROXY "";
  fastcgi_read_timeout 120s;
  fastcgi_hide_header X-Powered-By;
 }

 location ~ \.php$ { return 404; }

 location = /index.html {
  add_header Cache-Control 'no-store';
 }

 location / { try_files $uri $uri/ /index.html; }

 location ~* \.(js|wasm|json|map)$ {
  add_header Cache-Control 'no-cache';
  try_files $uri =404;
 }

 gzip on;
 gzip_types application/json application/javascript text/css application/wasm;
}
