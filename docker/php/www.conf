; ---------------------------------------------------------------------------
; php-fpm pool for the API.
;
; Sizing assumption: every handler is short. Slow work is dispatched to the queue
; (see docker/worker/supervisord.conf), so the pool is tuned for concurrency of
; fast requests rather than for a few long ones. If you find yourself raising
; pm.max_children to fix latency, the real problem is almost always a synchronous
; AI or media call that belongs on a queue.
; ---------------------------------------------------------------------------
[www]
user = app
group = app

listen = 0.0.0.0:9000
listen.backlog = 511

; Dynamic rather than static: in development most of these processes are idle,
; and idle FPM children each hold a MySQL connection open.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; Recycle workers periodically. PHP leaks slowly under long-lived FPM children,
; and a fresh child also re-reads any rotated config.
pm.max_requests = 500

; Surface a stalled request instead of letting nginx time out mysteriously.
; Slightly under the nginx fastcgi_read_timeout so the FPM log names the script.
request_terminate_timeout = 110
request_slowlog_timeout = 5
slowlog = /dev/stderr

; Health and metrics: consumed by the compose healthcheck and, in production,
; by whatever is scraping FPM (see docs/DEPLOYMENT.md).
ping.path = /fpm-ping
ping.response = pong
pm.status_path = /fpm-status

catch_workers_output = yes
decorate_workers_output = no
clear_env = no

; Errors go to the container log, never to a file inside the image.
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
