; ---------------------------------------------------------------------------
; PHP settings for the Zaban backend.
;
; The workload is unusual for a Laravel app in three ways, and each of these
; values follows from one of them:
;
;   1. Requests are JSON API calls that should finish in milliseconds. Anything
;      slow (AI generation, media rendering, transcription) is queued, so the
;      web timeout is deliberately short — a request that runs for two minutes
;      is a bug, not a workload.
;   2. CLI runs are the opposite: `content:import` decodes ~9 MB of curriculum
;      JSON and writes hundreds of thousands of rows in one process, and the AI
;      providers shell out to binaries that can take ten minutes.
;   3. Learners upload audio. Not video, not documents — short speech clips.
;
; Loaded as conf.d/zz-zaban.ini so it wins over the distribution defaults.
; ---------------------------------------------------------------------------

[PHP]
expose_php = Off
date.timezone = UTC

; Enough headroom for the importer's largest batch and for GD compositing in the
; placeholder image provider, without letting a runaway request eat the box.
memory_limit = 512M

; Web requests only. The CLI SAPI ignores this (max_execution_time is 0 there),
; which is what lets content:import and the AI providers run long.
max_execution_time = 120
max_input_time = 60

; The curriculum payloads and exam submissions are deep but not wide.
max_input_vars = 2000
max_input_nesting_level = 128

; Learner speech attempts: a 60-second clip at 128 kbps is under 1 MB, so 32 MB
; is generous. Raising this further only widens the abuse surface.
upload_max_filesize = 32M
post_max_size = 32M
max_file_uploads = 10

; Container convention: logs go to the collector, not to a file inside the image.
log_errors = On
error_log = /dev/stderr
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL

; ---------------------------------------------------------------------------
; OPcache
; ---------------------------------------------------------------------------
[opcache]
opcache.enable = 1
opcache.enable_cli = 0

; The app is large — 126 migration/model/service classes plus the framework.
; Undersizing this silently thrashes the cache and shows up as random latency.
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000

; Development default: pick up edits within a second. The production image sets
; opcache.validate_timestamps=0 (see docker/php/Dockerfile, prod target), which
; requires an explicit reload on deploy.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 1

opcache.save_comments = 1          ; Laravel's attribute/annotation reading needs these
opcache.fast_shutdown = 1

; JIT is deliberately off. This workload is I/O and database bound; JIT buys
; almost nothing for it and complicates crash triage.
opcache.jit = disable
opcache.jit_buffer_size = 0

; ---------------------------------------------------------------------------
; Realpath cache — the bind-mounted source tree does a lot of stat() calls.
; ---------------------------------------------------------------------------
realpath_cache_size = 4096K
realpath_cache_ttl = 600
