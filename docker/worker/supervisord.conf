; ---------------------------------------------------------------------------
; Queue worker supervision.
;
; The application splits background work across six named queues. They exist so
; that one slow class of work cannot starve another: a ten-minute Higgsfield
; video render and a two-second "recalculate this learner's due reviews" job must
; not sit in the same line.
;
;   default   ordinary application work with no special latency or cost profile
;   content   ingestion and curriculum derivation — long, bursty, restartable
;   media     image/video/audio generation and mirroring; minutes per job
;   speech    transcription and forced alignment of learner recordings; a learner
;             is waiting, so this gets its own workers and a short backoff
;   ai-high   interactive AI: tutor replies, live grading, conversation turns.
;             Someone is staring at a spinner. Highest priority, lowest timeout.
;   ai-low    batch AI: pre-generating exercises, explanations, exam scoring
;
; Each queue is its own [program] rather than one worker with a comma-separated
; --queue list, because a comma list is priority-ordered *within a single worker*:
; a worker busy on a 10-minute media job cannot pick up an ai-high job however
; high its priority. Separate process pools give real isolation.
;
; STATUS: the queue names and this topology are settled, but the application does
; not dispatch any jobs yet — there is no app/Jobs directory in the codebase.
; These workers therefore start, connect and idle. They are here so that the
; first job dispatched has somewhere to run, and so the topology is reviewed
; before it is depended on rather than after.
; ---------------------------------------------------------------------------
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; A control socket so `supervisorctl status` works inside the container. The
; compose healthcheck and `make queue-status` both use it, which is a better
; signal than "the container is up" — supervisord stays up even when every
; worker program is in FATAL.
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:queue-default]
process_name=%(program_name)s_%(process_num)02d
command=php /srv/zaban/backend/artisan queue:work --queue=default --sleep=3 --tries=3 --backoff=5,30,120 --max-time=3600 --timeout=120
autostart=true
autorestart=true
; SIGTERM is what queue:work listens for to finish the current job and exit.
stopsignal=TERM
; Longer than the job timeout, so a redeploy lets an in-flight job finish.
stopwaitsecs=150
numprocs=2
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:queue-content]
process_name=%(program_name)s_%(process_num)02d
; Ingestion jobs are long and idempotent by design (content:import updates rather
; than duplicates), so a generous timeout and a single retry is right: retrying a
; half-finished import is safe, running four of them at once is not.
command=php /srv/zaban/backend/artisan queue:work --queue=content --sleep=5 --tries=2 --backoff=60 --max-time=3600 --timeout=1800
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=1830
numprocs=1
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:queue-media]
process_name=%(program_name)s_%(process_num)02d
; HIGGSFIELD_TIMEOUT defaults to 600s in config/ai.php and the provider then
; mirrors the result into our own storage, so the job timeout has to exceed the
; provider timeout with room for the download.
command=php /srv/zaban/backend/artisan queue:work --queue=media --sleep=3 --tries=3 --backoff=30,180,600 --max-time=3600 --timeout=900
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=930
numprocs=2
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:queue-speech]
process_name=%(program_name)s_%(process_num)02d
; WHISPER_TIMEOUT defaults to 300s; forced alignment runs in the same window.
; Short backoff because a learner is waiting for their pronunciation score.
command=php /srv/zaban/backend/artisan queue:work --queue=speech --sleep=1 --tries=3 --backoff=5,20,60 --max-time=3600 --timeout=420
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=450
numprocs=2
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:queue-writing]
process_name=%(program_name)s_%(process_num)02d
; Two AI calls at worst - read the page, then mark it - and a learner is
; waiting for both, so the backoff is short like speech rather than patient
; like content. The timeout covers a full-page vision call on a phone photo.
command=php /srv/zaban/backend/artisan queue:work --queue=writing --sleep=1 --tries=3 --backoff=5,20,60 --max-time=3600 --timeout=360
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=390
numprocs=2
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:queue-ai-high]
process_name=%(program_name)s_%(process_num)02d
; Interactive AI. --sleep=0 keeps latency down when the queue is empty; the cost
; is a busier Redis, which is a good trade for a live tutor reply.
command=php /srv/zaban/backend/artisan queue:work --queue=ai-high --sleep=0 --tries=2 --backoff=3,15 --max-time=3600 --timeout=180
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=200
numprocs=2
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:queue-ai-low]
process_name=%(program_name)s_%(process_num)02d
; Batch AI. Retries are cheap here in wall-clock terms but not in money: every
; attempt is a real billed call recorded in ai_requests/ai_usage, so the retry
; count stays low and the backoff long.
command=php /srv/zaban/backend/artisan queue:work --queue=ai-low --sleep=5 --tries=2 --backoff=120,600 --max-time=3600 --timeout=600
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=630
numprocs=1
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
