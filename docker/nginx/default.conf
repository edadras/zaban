# ---------------------------------------------------------------------------
# Site config for the Zaban API.
#
# This server block fronts a JSON API and a private media store. It is not
# serving a website, so the usual "try_files then index.html" shape is replaced
# by: everything that is not a real file goes to Laravel's front controller.
# ---------------------------------------------------------------------------

server {
    listen 80 default_server;
    server_name _;

    # The Laravel app lives at <repo>/backend; its public/ is the only directory
    # nginx is ever allowed to see.
    root /srv/zaban/backend/public;
    index index.php;

    charset utf-8;

    # Learner speech uploads. Must stay >= php.ini upload_max_filesize, or nginx
    # rejects the body before PHP can return a useful JSON error.
    client_max_body_size 32M;
    client_body_timeout 60s;

    # No version advertising, and the standard set of hardening headers. The API
    # is consumed by a mobile client, so a restrictive CSP costs nothing here.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Health endpoint registered by bootstrap/app.php (health: '/up').
    # Kept out of the access log so it does not drown real traffic.
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # php-fpm's own ping/status. Never exposed publicly: only the container
    # network and localhost may ask.
    location ~ ^/(fpm-ping|fpm-status)$ {
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
    }

    # Static assets under public/ (the built Vite bundle, if any). Media is NOT
    # served from here — see the note at the bottom of this file.
    location ~* \.(?:css|js|png|jpe?g|gif|svg|woff2?|ico|mp3|mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_pass app:9000;

        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";

        # Long enough to outlive request_terminate_timeout in the FPM pool (110s),
        # so a stalled request is reported by PHP with a stack trace rather than
        # by nginx as a bare 504.
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # X-Accel-Redirect from the app (private media delivery) is honoured here.
        fastcgi_hide_header X-Powered-By;

        internal;
    }

    # Any other .php file is a mistake or an attack.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # ---------------------------------------------------------------------
    # Media delivery
    #
    # Book audio, page images and AI-generated media are NOT public files. They
    # live on the configured filesystem disk (local in development, S3/MinIO
    # otherwise) and are reached through the API, which is where entitlement and
    # signature checks belong. The intended production shape is either a signed
    # object-store URL or an X-Accel-Redirect into an `internal` location here.
    # Neither is wired up yet — the media endpoints are still to be built — so
    # there is deliberately no public alias to storage/ in this file.
    # ---------------------------------------------------------------------
}
